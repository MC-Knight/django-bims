version: "3.7"
volumes:
  rabbitmq:
  geoserver-datadir:
  geonode-statics:
  geonode-geoserver-datadir:
  geonode-backup-restore:
  geonode-data:
  geonode-tmp:
  geonode-dbdata:
  geonode-redisdata:

networks:
  # GeoNode's private network, see the geonode_* services below
  geonode:

x-geonode-env: &geonode-env
  - geonode/common.env
  - geonode/dev.env
  - geonode/secrets.env

# Same as in docker-compose.yml; see the comments there.
x-geonode-django: &default-geonode-django
  image: geonode/geonode:5.1.1
  restart: unless-stopped
  env_file: *geonode-env
  entrypoint:
    - /bin/bash
    - -c
    - /usr/bin/wait-for-databases db && exec /usr/src/geonode/entrypoint.sh "$$@"
    - geonode-entrypoint
  volumes:
    - geonode-statics:/mnt/volumes/statics
    - geonode-geoserver-datadir:/geoserver_data/data
    - geonode-backup-restore:/backup_restore
    - geonode-data:/data
    - geonode-tmp:/tmp
  depends_on:
    - geonode_db
    - geonode_redis
    - geonode_memcached
    - geonode_gsconf

x-common-django: &default-common-django
  build:
    context: ../
    dockerfile: deployment/docker/Dockerfile
    target: dev
  hostname: dev
  command: ""
  entrypoint: []
  working_dir: /home/web/django_project
  environment:
    - ADMIN_EMAILS=${ADMIN_EMAILS:-dimas@kartoza.com}
    - APP_NAME=bims
    - ASYNC_SIGNALS=True
    - BROKER_URL=amqp://rabbitmq:5672
    - CELERY_BROKER_URL=amqp://rabbitmq:5672
    - C_FORCE_ROOT=1
    - CONTACT_US_EMAIL=${ADMIN_EMAILS:-dimas@kartoza.com}
    - ALLOWED_HOSTS=['*']
    - DATABASE_HOST=db
    - DATABASE_NAME=${POSTGRES_DBNAME:-gis}
    - DATABASE_PASSWORD=${POSTGRES_PASS:-docker}
    - DATABASE_URL=postgis://${POSTGRES_USER:-docker}:${POSTGRES_PASS:-docker}@db:5432/${POSTGRES_DBNAME:-gis}
    - DATABASE_USERNAME=${POSTGRES_USER:-docker}
    - DJANGO_SETTINGS_MODULE=core.settings.dev_docker
    - GEOCONTEXT_URL=${GEOCONTEXT_URL:-https://geocontext.kartoza.com}
    - GEOSERVER_LOCATION=http://geoserver:8080/geoserver
    - GEOSERVER_LOCATION_SITE_LAYER=bims:location_site_view
    - GEOSERVER_PUBLIC_LOCATION=http://geoserver:8080/geoserver
    - GEOSERVER_ADMIN_USER=${GEOSERVER_USERNAME:-admin}
    - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_PASSWORD:-admingeoserver}
    - MEDIA_ROOT=/home/web/media
    - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
    - ROOT_URLCONF=core.urls
    - SITEURL=http://localhost:63307/
    - LOGOUT_REDIRECT_URL=http://localhost:8000/
    - STATIC_ROOT=/home/web/static/static
    - VIRTUAL_HOST=bims.kartoza.com
    - VIRTUAL_PORT=8080
    - PYTHONPATH=/home/web/django_project/
  restart: unless-stopped
  user: root
  extra_hosts:
    - "localhost:192.168.1.197"
  volumes:
    - ../:/home/web/django_project
    - ./static:/home/web/static:rw
    - ./media:/home/web/media:rw

services:
  cache:
    container_name: bims_dev_cache
    image: memcached
    entrypoint:
      - memcached
      - -m 64

  db:
    container_name: bims_dev_db
    image: kartoza/postgis:11.5-2.5
    environment:
      ALLOW_IP_RANGE: 0.0.0.0/0
      POSTGRES_USER: ${POSTGRES_USER:-docker}
      POSTGRES_PASS: ${POSTGRES_PASS:-docker}
      POSTGRES_DBNAME: ${POSTGRES_DBNAME:-gis}
    volumes:
      - ./pg/postgres_data:/var/lib/postgresql
      - ./backups:/backups
      - ./sql:/sql
    ports:
      - "6543:5432"

  geoserver:
    container_name: bims_dev_geoserver
    image: kartoza/geoserver:2.19.0
    ports:
      - "63305:8080"
    restart: unless-stopped
    environment:
      HTTP_HOST: ${HTTP_HOST:-0.0.0.0}
      HTTP_PORT: ${GEOSERVER_PORT:-63305}
      GEOSERVER_ADMIN_USER: ${GEOSERVER_USERNAME:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_PASSWORD:-admingeoserver}
      DATABASE_URL: postgres://${POSTGRES_USER:-docker}:${POSTGRES_PASS:-docker}@db:5432/${POSTGRES_DBNAME:-gis}
    depends_on:
      - db
    volumes:
      - geoserver-datadir:/opt/geoserver/data_dir/
    networks:
      default:
        aliases:
          - geoserver

  rabbitmq:
    container_name: bims_dev_rabbitmq
    image: rabbitmq:3.7-alpine
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    restart: on-failure

  worker:
    <<: *default-common-django
    container_name: bims_dev_worker
    hostname: worker
    depends_on:
      - db
      - cache
      - rabbitmq
    volumes:
      - ../:/home/web/django_project
      - ./static:/home/web/static:rw
      - ./media:/home/web/media:rw
      - ./scheduler-data:/home/scheduler-data
    command: python -m celery --app=bims.celery:app worker --schedule /home/geocontext-scheduler/celerybeat-schedule -B --schedule /home/scheduler-data/celerybeat-schedule -l debug

  searchworker:
    <<: *default-common-django
    container_name: bims_search_worker
    hostname: worker
    depends_on:
      - db
      - cache
      - rabbitmq
    volumes:
      - ../:/home/web/django_project
      - ./static:/home/web/static:rw
      - ./media:/home/web/media:rw
    command: python -m celery worker --app=bims.celery:app -Q search -B -l debug

  dev:
    <<: *default-common-django
    container_name: bims_dev_django
    links:
      - db:db
      - rabbitmq:rabbitmq
      - worker:worker
    ports:
      # for django test server
      - "63302:8080"
      # for ssh
      - "63303:22"

  # GeoNode 5.1.1 -> http://localhost:63310
  # See the GeoNode section in docker-compose.yml. Before the first start:
  #   bash deployment/geonode/make-secrets.sh
  # then
  #   docker-compose -f deployment/docker-compose.dev.yml up -d geonode_nginx geonode_celery
  geonode_django:
    <<: *default-geonode-django
    container_name: bims_dev_geonode_django
    environment:
      - IS_CELERY=False
    command: uwsgi --ini /usr/src/geonode/uwsgi.ini --processes 4 --cheaper 1 --cheaper-initial 2 --cheaper-step 1
    healthcheck:
      test: curl -m 10 --fail --silent --output /dev/null http://django:8000/
      start_period: 180s
      interval: 60s
      timeout: 10s
      retries: 2
    networks:
      geonode:
        aliases:
          - django

  geonode_celery:
    <<: *default-geonode-django
    container_name: bims_dev_geonode_celery
    environment:
      - IS_CELERY=True
    command: celery-cmd
    networks:
      - geonode

  geonode_geoserver:
    container_name: bims_dev_geonode_geoserver
    image: geonode/geoserver:2.28.6-latest
    restart: unless-stopped
    env_file: *geonode-env
    volumes:
      - geonode-statics:/mnt/volumes/statics
      - geonode-geoserver-datadir:/geoserver_data/data
      - geonode-backup-restore:/backup_restore
      - geonode-data:/data
      - geonode-tmp:/tmp
    depends_on:
      - geonode_gsconf
      - geonode_django
    healthcheck:
      test: curl -m 10 --fail --silent --output /dev/null http://geoserver:8080/geoserver/ows
      start_period: 180s
      interval: 60s
      timeout: 10s
      retries: 2
    networks:
      geonode:
        aliases:
          - geoserver

  geonode_gsconf:
    container_name: bims_dev_geonode_gsconf
    image: geonode/geoserver_data:2.28.6-latest
    entrypoint: sleep infinity
    restart: unless-stopped
    volumes:
      - geonode-geoserver-datadir:/geoserver_data/data
    networks:
      - geonode

  geonode_db:
    container_name: bims_dev_geonode_db
    image: geonode/postgis:15-3.5-latest
    command: postgres -c max_connections=200
    restart: unless-stopped
    env_file: *geonode-env
    volumes:
      - geonode-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -d postgres -U postgres
    networks:
      geonode:
        aliases:
          - db

  geonode_redis:
    container_name: bims_dev_geonode_redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - geonode-redisdata:/data
    networks:
      geonode:
        aliases:
          - redis

  geonode_memcached:
    container_name: bims_dev_geonode_memcached
    image: memcached:alpine
    restart: unless-stopped
    networks:
      geonode:
        aliases:
          - memcached

  geonode_nginx:
    container_name: bims_dev_geonode_nginx
    image: geonode/nginx:1.31.7-latest
    restart: unless-stopped
    env_file: *geonode-env
    ports:
      - "63310:80"
    volumes:
      - geonode-statics:/mnt/volumes/statics
    depends_on:
      - geonode_django
      - geonode_geoserver
    networks:
      geonode:
        aliases:
          - geonode
