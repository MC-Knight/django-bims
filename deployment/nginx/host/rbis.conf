# Host nginx config for rbis.ur.ac.rw on the production server.
# Live copy: /etc/nginx/sites-available/rbis (enabled via sites-enabled).
#
# Docker containers it talks to (ports published on the host):
#   bims_prod_uwsgi     -> 127.0.0.1:8080 (uwsgi socket)
#   bims_prod_geoserver -> 127.0.0.1:5100 (http, context path /geoserver)
#
# Before the first reload, create the WMS cache directory:
#   sudo mkdir -p /var/cache/nginx/rbis_wms && sudo chown www-data: /var/cache/nginx/rbis_wms
# Then: sudo nginx -t && sudo systemctl reload nginx

# Define connection details for connecting to django running in
# a docker container.
upstream django {
    server 127.0.0.1:8080;
}

# GeoServer container. Named rbis_geoserver so it can't clash with the
# "geoserver" upstream in sites-available/rbis-geoserver (the old IP route).
upstream rbis_geoserver {
    server 127.0.0.1:5100;
    keepalive 16;
}

# Cache for map images rendered by GeoServer. Most visitors request the same
# default map view, so these are served from disk instead of re-rendered.
proxy_cache_path /var/cache/nginx/rbis_wms levels=1:2 keys_zone=rbis_wms:20m
                 max_size=2g inactive=7d use_temp_path=off;

# Only cache image responses. GeoServer returns errors (ServiceException XML)
# with HTTP 200, and those must not stick in the cache.
map $upstream_http_content_type $rbis_wms_no_cache {
    "~*^image/" 0;
    default     1;
}

# Files collected by ManifestStaticFilesStorage carry a 12-char content hash
# in their name (e.g. optimized.3f2a9c1b7d4e.js), so they can be cached
# forever: a new build gets a new name.
map $uri $rbis_static_expires {
    "~*\.[0-9a-f]{12}\.(css|js|map|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|otf|json)$" max;
    default 21d;
}

# Slow down password guessing on the GeoServer admin login
limit_req_zone $binary_remote_addr zone=rbis_geoserver_login:1m rate=10r/m;

# Main Django application server block
server {
    # OTF gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 860;
    gzip_comp_level 5;
    gzip_proxied any;
    # application/javascript and text/javascript were missing, so every JS
    # file (including OpenLayers) was sent uncompressed.
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/x-javascript
               application/json application/geo+json application/xml
               application/vnd.ogc.wms_xml application/vnd.ogc.se_xml
               application/vnd.ogc.gml image/svg+xml
               font/ttf font/otf application/vnd.ms-fontobject;
    gzip_disable "MSIE [1-6].(?!.*SV1)";

    access_log /var/log/nginx/rbis_access.log;
    error_log /var/log/nginx/rbis_error.log;
    server_name rbis.ur.ac.rw;
    charset utf-8;

    # Shared settings for the GeoServer locations below (proxy_* only;
    # the Django location uses uwsgi_pass and ignores these).
    # Don't add proxy_set_header inside a location: nginx would then drop
    # all of these for that location instead of merging.
    proxy_http_version 1.1;
    # Fetch uncompressed from GeoServer so sub_filter can rewrite responses;
    # nginx gzips them on the way out (a local hop, so no cost).
    proxy_set_header Accept-Encoding "";
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Drop any non django related requests
    location ~ (\.php|.aspx|.asp|myadmin) {
            return 404;
    }

    # Block bots
    if ($http_user_agent ~* (360Spider|80legs.com|Abonti|AcoonBot|Acunetix|adbeat_bot|AddThis.com|adidxbot|ADmantX|AhrefsBot|AngloINFO|Antelope|Applebot|BaiduSpider|BeetleBot|billigerbot|binlar|bitlybot|BlackWidow|BLP_bbot|BoardReader|Bolt\ 0|BOT\ for\ JCE|Bot\ mailto\:craftbot@yahoo\.com|casper|CazoodleBot|CCBot|checkprivacy|ChinaClaw|chromeframe|Clerkbot|Cliqzbot|clshttp|CommonCrawler|comodo|CPython|crawler4j|Crawlera|CRAZYWEBCRAWLER|Curious|Curl|Custo|CWS_proxy|Default\ Browser\ 0|diavol|DigExt|Digincore|DIIbot|discobot|DISCo|DoCoMo|DotBot|Download\ Demon|DTS.Agent|EasouSpider|eCatch|ecxi|EirGrabber|Elmer|EmailCollector|EmailSiphon|EmailWolf|Exabot|ExaleadCloudView|ExpertSearchSpider|ExpertSearch|Express\ WebPictures|ExtractorPro|extract|EyeNetIE|Ezooms|F2S|FastSeek|feedfinder|FeedlyBot|FHscan|finbot|Flamingo_SearchEngine|FlappyBot|FlashGet|flicky|Flipboard|g00g1e|Genieo|genieo|GetRight|GetWeb\!|GigablastOpenSource|GozaikBot|Go\!Zilla|Go\-Ahead\-Got\-It|GrabNet|grab|Grafula|GrapeshotCrawler|GTB5|GT\:\:WWW|Guzzle|harvest|heritrix|HMView|HomePageBot|HTTP\:\:Lite|HTTrack|HubSpot|ia_archiver|icarus6|IDBot|id\-search|IlseBot|Image\ Stripper|Image\ Sucker|Indigonet|Indy\ Library|integromedb|InterGET|InternetSeer\.com|Internet\ Ninja|IRLbot|ISC\ Systems\ iRc\ Search\ 2\.1|jakarta|Java|JetCar|JobdiggerSpider|JOC\ Web\ Spider|Jooblebot|kanagawa|KINGSpider|kmccrew|larbin|LeechFTP|libwww|Lingewoud|LinkChecker|linkdexbot|LinksCrawler|LinksManager\.com_bot|linkwalker|LinqiaRSSBot|LivelapBot|ltx71|LubbersBot|lwp\-trivial|Mail.RU_Bot|masscan|Mass\ Downloader|maverick|Maxthon$|Mediatoolkitbot|MegaIndex|MegaIndex|megaindex|MFC_Tear_Sample|Microsoft\ URL\ Control|microsoft\.url|MIDown\ tool|miner|Missigua\ Locator|Mister\ PiX|mj12bot|Mozilla.*Indy|Mozilla.*NEWT|MSFrontPage|msnbot|Navroad|NearSite|NetAnts|netEstate|NetSpider|NetZIP|Net\ Vampire|NextGenSearchBot|nutch|Octopus|Offline\ Explorer|Offline\ Navigator|OpenindexSpider|OpenWebSpider|OrangeBot|Owlin|PageGrabber|PagesInventory|panopta|panscient\.com|Papa\ Foto|pavuk|pcBrowser|PECL\:\:HTTP|PeoplePal|Photon|PHPCrawl|planetwork|PleaseCrawl|PNAMAIN.EXE|PodcastPartyBot|prijsbest|proximic|psbot|purebot|pycurl|QuerySeekerSpider|R6_CommentReader|R6_FeedFetcher|RealDownload|ReGet|Riddler|Rippers\ 0|rogerbot|RSSingBot|rv\:1.9.1|RyzeCrawler|SafeSearch|SBIder|Scrapy|Scrapy|Screaming|SeaMonkey$|search.goo.ne.jp|SearchmetricsBot|search_robot|SemrushBot|Semrush|SentiBot|SEOkicks|SeznamBot|ShowyouBot|SightupBot|SISTRIX|sitecheck\.internetseer\.com|siteexplorer.info|SiteSnagger|skygrid|Slackbot|Slurp|SmartDownload|Snoopy|Sogou|Sosospider|spaumbot|Steeler|sucker|SuperBot|Superfeedr|SuperHTTP|SurdotlyBot|Surfbot|tAkeOut|Teleport\ Pro|TinEye-bot|TinEye|Toata\ dragostea\ mea\ pentru\ diavola|Toplistbot|trendictionbot|TurnitinBot|turnit|Twitterbot|URI\:\:Fetch|urllib|Vagabondo|Vagabondo|vikspider|VoidEYE|VoilaBot|WBSearchBot|webalta|WebAuto|WebBandit|WebCollage|WebCopier|WebFetch|WebGo\ IS|WebLeacher|WebReaper|WebSauger|Website\ eXtractor|Website\ Quester|WebStripper|WebWhacker|WebZIP|Web\ Image\ Collector|Web\ Sucker|Wells\ Search\ II|WEP\ Search|WeSEE|Wget|Widow|WinInet|woobot|woopingbot|worldwebheritage.org|Wotbox|WPScan|WWWOFFLE|WWW\-Mechanize|Xaldon\ WebSpider|XoviBot|yacybot|Yahoo|YandexBot|Yandex|YisouSpider|zermelo|Zeus|zh-CN|ZmEu|ZumBot|ZyBorg) ) {
        return 410;
    }

    # max upload size, adjust to taste
    client_max_body_size 100M;

    # Django media and static files
    location /uploaded  {
        alias /var/lib/docker/volumes/deployment_media-data/_data;
        expires 21d;
    }
    location /media  {
        alias /var/lib/docker/volumes/deployment_media-data/_data;
        expires 21d;
    }
    location /static {
        alias /var/lib/docker/volumes/deployment_static-data/_data;
        expires $rbis_static_expires;
    }

    # ------------------------------------------------------------------
    # Map layers: skip Django for our own GeoServer.
    #
    # The map JS requests GeoServer WMS through Django's open proxy, e.g.
    #   /bims_proxy/http://geoserver:8080/geoserver/wms?LAYERS=...
    # which tied up a uWSGI worker for every map image. Requests aimed at the
    # internal GeoServer go straight to the container instead (same URL, same
    # GeoServer, Django just isn't in the middle). Anything else under
    # /bims_proxy/ still goes to Django as before.
    #
    # nginx merges "//" to "/" before matching, hence "https?:/+".
    # ------------------------------------------------------------------
    location ~ ^/bims_proxy/https?:/+geoserver:8080/geoserver/+(wms|ows)$ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://rbis_geoserver/geoserver/$1$is_args$args;

        proxy_cache rbis_wms;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 10m;
        proxy_no_cache $rbis_wms_no_cache;
        # Identical concurrent requests wait for one render instead of all
        # hitting GeoServer; serve the old image while a new one is fetched.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # WMS here is anonymous; don't let a stray cookie disable caching
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # External GeoServer access: https://rbis.ur.ac.rw/geoserver/
    # For GIS technicians (QGIS, admin UI) while geoserver.rbis.ur.ac.rw
    # isn't mapped yet. Path is passed through unchanged, so GeoServer's own
    # links, redirects and capabilities documents keep working.
    # The app itself does NOT use this route; it talks to geoserver:8080
    # inside docker.
    # ------------------------------------------------------------------
    location = /geoserver {
        return 301 /geoserver/;
    }

    location ^~ /geoserver/ {
        proxy_pass http://rbis_geoserver;
        # Tomcat builds absolute redirects with http://, fix them up to https
        proxy_redirect http://$host/ https://$host/;
        # GeoServer only sees plain http from nginx, so capabilities documents
        # advertise http:// service URLs to QGIS. Rewrite them to https here
        # rather than setting a global Proxy Base URL in GeoServer, which
        # would also change the URLs the app gets back internally.
        # (Needs upstream gzip off, see Accept-Encoding at server level.)
        sub_filter "http://$host/geoserver" "https://$host/geoserver";
        sub_filter_once off;
        sub_filter_types text/xml application/xml application/vnd.ogc.wms_xml
                         application/vnd.ogc.se_xml application/json
                         application/javascript;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # Shapefile / raster uploads through the admin UI and REST
        client_max_body_size 500M;
        proxy_request_buffering off;
    }

    location = /geoserver/j_spring_security_check {
        limit_req zone=rbis_geoserver_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://rbis_geoserver;
        proxy_redirect http://$host/ https://$host/;
    }

    # Optional: restrict the admin UI and REST API to known networks while
    # leaving WMS/WFS/WCS open. Replace the ranges with the real ones, then
    # uncomment. (The app uses REST internally via docker, not this route.)
    #
    # location ^~ /geoserver/web/ {
    #     allow 10.0.0.0/8;
    #     deny all;
    #     proxy_pass http://rbis_geoserver;
    #     proxy_redirect http://$host/ https://$host/;
    # }
    # location ^~ /geoserver/rest/ {
    #     allow 10.0.0.0/8;
    #     deny all;
    #     proxy_pass http://rbis_geoserver;
    #     proxy_redirect http://$host/ https://$host/;
    # }

    # Proxy to Django
    location / {
        uwsgi_pass django;
        include uwsgi_params;
    }



    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rbis.ur.ac.rw/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rbis.ur.ac.rw/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = rbis.ur.ac.rw) {
        return 301 https://$host$request_uri;
    } # managed by Certbot



    listen 80;
    server_name rbis.ur.ac.rw;
    return 404; # managed by Certbot


}
