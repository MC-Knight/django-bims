# Host nginx config for geonode.rbis.ur.ac.rw on the production server.
# Live copy: /etc/nginx/sites-available/rbis-geonode (enabled via sites-enabled).
#
# DNS: geonode.rbis.ur.ac.rw is a CNAME of biodiv.ur.ac.rw, the same address
# as rbis.ur.ac.rw, so it already reaches this nginx.
#
# GeoNode runs in docker (geonode_* services in deployment/docker-compose.yml).
# Its own nginx container routes /geoserver/ (GeoNode's GeoServer, not the
# BIMS one), /static/, /uploaded/ and Django. That container is published on
# 127.0.0.1:5443 and runs in its HTTPS mode with a self-signed certificate.
# This file only does the public TLS and passes every request through
# unchanged, like the /geoserver/ route in rbis.conf.
#
# First install, after the GeoNode containers are up:
#   sudo certbot certonly --nginx -d geonode.rbis.ur.ac.rw
#   sudo cp deployment/nginx/host/geonode.conf /etc/nginx/sites-available/rbis-geonode
#   sudo ln -s /etc/nginx/sites-available/rbis-geonode /etc/nginx/sites-enabled/rbis-geonode
#   sudo nginx -t && sudo systemctl reload nginx

upstream geonode_nginx {
    server 127.0.0.1:5443;
    keepalive 16;
}

server {
    # Same listen options as rbis.conf: http2 here would switch it on for
    # every site on this port.
    listen 443 ssl;
    server_name geonode.rbis.ur.ac.rw;

    ssl_certificate /etc/letsencrypt/live/geonode.rbis.ur.ac.rw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geonode.rbis.ur.ac.rw/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/geonode_access.log;
    error_log /var/log/nginx/geonode_error.log;
    charset utf-8;

    # Layer / raster / document uploads
    client_max_body_size 2G;

    location / {
        proxy_pass https://geonode_nginx;
        # Loopback hop to a self-signed certificate
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Same limits as GeoNode's own nginx (uploads, big WFS/WCS requests)
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    server_name geonode.rbis.ur.ac.rw;

    # Redirect inside a location, not at server level, so certbot renewals
    # can still add their /.well-known/acme-challenge/ location here.
    location / {
        return 301 https://$host$request_uri;
    }
}
