#
# Production server with UWSGI configured to run on port 8080
# and web configured to run directly on port 80
#
# docker-compose build
# docker-compose up -d web
#
# See accompanying Make commands for easy collectstatic etc.

version: '3.7'
volumes:
  postgres-data:
  geoserver-datadir:
  rabbitmq:
  static-data:
  media-data:
  geocontext-scheduler-data:
  geonode-statics:
  geonode-geoserver-datadir:
  geonode-backup-restore:
  geonode-data:
  geonode-tmp:
  geonode-dbdata:
  geonode-redisdata:

networks:
  # GeoNode's private network, see the geonode_* services below
  geonode:

x-geonode-env:
  &geonode-env
  - geonode/common.env
  - geonode/prod.env
  - geonode/secrets.env

x-geonode-django:
  &default-geonode-django
  image: geonode/geonode:5.1.1
  restart: unless-stopped
  env_file: *geonode-env
  # Wait until the GeoNode databases accept logins, then hand over to the
  # image's own entrypoint (migrations, fixtures, collectstatic). Done here
  # rather than with depends_on "condition: service_healthy", which older
  # docker-compose versions refuse to parse.
  entrypoint:
    - /bin/bash
    - -c
    - /usr/bin/wait-for-databases db && exec /usr/src/geonode/entrypoint.sh "$$@"
    - geonode-entrypoint
  volumes:
    - geonode-statics:/mnt/volumes/statics
    - geonode-geoserver-datadir:/geoserver_data/data
    - geonode-backup-restore:/backup_restore
    - geonode-data:/data
    - geonode-tmp:/tmp
  depends_on:
    - geonode_db
    - geonode_redis
    - geonode_memcached
    - geonode_gsconf

x-common-django:
  &default-common-django
  image: bims_uwsgi:latest
  build:
    context: ../
    dockerfile: deployment/docker/Dockerfile
  command: uwsgi --ini /home/web/django_project/uwsgi.ini
  hostname: uwsgi
  working_dir: /home/web/django_project
  environment:
    - ADMIN_EMAILS=${ADMIN_EMAILS:-tetobobo43@gmail.com}
    - APP_NAME=bims
    - ASYNC_SIGNALS=True
    - BROKER_URL=amqp://rabbitmq:5672
    - C_FORCE_ROOT=1
    - CONTACT_US_EMAIL=${ADMIN_EMAILS:-tetobobo43@gmail.com}
    - ALLOWED_HOSTS=['*']
    - DATABASE_HOST=bims_prod_db
    - DATABASE_NAME=${POSTGRES_DBNAME:-gis}
    - DATABASE_PASSWORD=${POSTGRES_PASS:-docker}
    - DATABASE_URL=postgis://${POSTGRES_USER:-docker}:${POSTGRES_PASS:-docker}@db:5432/${POSTGRES_DBNAME:-gis}
    - DATABASE_USERNAME=${POSTGRES_USER:-docker}
    - DJANGO_SETTINGS_MODULE=core.settings.prod_docker
    - GEOCONTEXT_URL=${GEOCONTEXT_URL:-https://geocontext.kartoza.com}
    - GEOSERVER_LOCATION=http://geoserver:8080/geoserver
    - GEOSERVER_LOCATION_SITE_LAYER=bims:location_site_view
    - GEOSERVER_PUBLIC_LOCATION=http://geoserver:8080/geoserver
    - GEOSERVER_ADMIN_USER=${GEOSERVER_USERNAME:-admin}
    - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_PASSWORD:-admingeoserver}
    - MEDIA_ROOT=/home/web/media
    - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
    - ROOT_URLCONF=core.urls
    - SITEURL=https://rbis.ur.ac.rw/
    - SITE_DOMAIN_NAME=https://rbis.ur.ac.rw
    - STATIC_ROOT=/home/web/static/static
    - VIRTUAL_HOST=bims.kartoza.com
    - VIRTUAL_PORT=8080
    - EMAIL_HOST=${EMAIL_HOST}
    - EMAIL_HOST_USER=${EMAIL_HOST_USER}
    - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    - EMAIL_PORT=${EMAIL_PORT}
    - EMAIL_SUBJECT_PREFIX=${EMAIL_SUBJECT_PREFIX}
  volumes:
    - static-data:/home/web/static
    - media-data:/home/web/media
    - /opt/bims/logs:/var/log/
  depends_on:
    - db
    - geoserver
    - rabbitmq
    - cache
  # The server can't reach its own public address, so inside these
  # containers GeoNode's hostname points at this host's nginx instead. Used
  # to look up which area each site is in (bims/utils/geoserver_context.py).
  extra_hosts:
    - "geonode.rbis.ur.ac.rw:host-gateway"
  restart: unless-stopped
  user: root

services:

  db:
    container_name: bims_prod_db
    image: kartoza/postgis:11.5-2.5
    ports:
      - "5200:5432"
    environment:
      - ALLOW_IP_RANGE=0.0.0.0/0
      - POSTGRES_DBNAME=${POSTGRES_DBNAME:-gis}
      - POSTGRES_USER=${POSTGRES_USER:-docker}
      - POSTGRES_PASS=${POSTGRES_PASS:-docker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  geoserver:
    container_name: bims_prod_geoserver
    image: kartoza/geoserver:2.19.0
    ports:
      - "5100:8080"
    restart: unless-stopped
    environment:
      HTTP_HOST: ${HTTP_HOST:-0.0.0.0}
      HTTP_PORT: 8080
      GEOSERVER_ADMIN_USER: ${GEOSERVER_USERNAME:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_PASSWORD:-admingeoserver}
      DATABASE_URL: postgres://${POSTGRES_USER:-docker}:${POSTGRES_PASS:-docker}@db:5432/${POSTGRES_DBNAME:-gis}
    depends_on:
      - db
    volumes:
      - geoserver-datadir:/opt/geoserver/data_dir/
    networks:
      default:
        aliases:
          - geoserver

  uwsgi:
    <<: *default-common-django
    container_name: bims_prod_uwsgi
    ports:
      - "8080:8080"

  worker:
    <<: *default-common-django
    container_name: bims_prod_worker
    entrypoint: [ ]
    hostname: updateworker
    command: celery worker --app=bims.celery:app -n update@%h -Q update -l info --max-tasks-per-child=100
    depends_on:
      - db
      - geoserver
      - rabbitmq
      - cache
    volumes:
      - static-data:/home/web/static
      - media-data:/home/web/media
      - ./logs:/var/log/

  geocontextworker:
    <<: *default-common-django
    container_name: bims_prod_geocontextworker
    entrypoint: [ ]
    hostname: geocontextworker
    command: celery worker --app=bims.celery:app -n geocontext@%h --schedule /home/geocontext-scheduler/celerybeat-schedule -Q geocontext -B -l info --max-tasks-per-child=100
    depends_on:
      - db
      - geoserver
      - rabbitmq
      - cache
    volumes:
      - static-data:/home/web/static
      - media-data:/home/web/media
      - ./logs:/var/log/
      - geocontext-scheduler-data:/home/geocontext-scheduler

  searchworker:
    <<: *default-common-django
    container_name: bims_prod_searchworker
    entrypoint: [ ]
    hostname: searchworker
    command: celery worker --app=bims.celery:app -n search@%h -Q search -l info --max-tasks-per-child=100
    depends_on:
      - db
      - geoserver
      - rabbitmq
      - cache
    volumes:
      - static-data:/home/web/static
      - media-data:/home/web/media
      - ./logs:/var/log/

  # Nightly pg_dump (23:00) to /opt/bims/backups/<year>/<month>/.
  # The image's PostgreSQL major version must match the db's (11):
  # pg_dump refuses to dump a newer server, so the old 9.6 image wrote
  # 0-byte files every night. The 11.0 image takes POSTGRES_* variables
  # (9.6 took PG*).
  # The image never deletes old dumps (~400 MB each), so the command below
  # adds a 23:30 cron job removing .dmp files older than BACKUP_KEEP_DAYS,
  # then starts the image as usual. The cron file is written inside the
  # container because cron ignores /etc/cron.d files not owned by root.
  dbbackups:
    container_name: bims_prod_dbbackups
    image: kartoza/pg-backup:11.0
    hostname: pg-backups
    depends_on:
      - db
    environment:
      - DUMPPREFIX=PG_bims
      - POSTGRES_USER=${POSTGRES_USER:-docker}
      - POSTGRES_PASS=${POSTGRES_PASS:-docker}
      - POSTGRES_PORT=5432
      - POSTGRES_HOST=bims_prod_db
      - POSTGRES_DBNAME=${POSTGRES_DBNAME:-gis}
      - BACKUP_KEEP_DAYS=30
    command:
      - /bin/bash
      - -c
      - echo "30 23 * * * root find /backups -type f -name '*.dmp' -mtime +$${BACKUP_KEEP_DAYS:-30} -delete" > /etc/cron.d/backups-cleanup && echo >> /etc/cron.d/backups-cleanup && exec /start.sh
    volumes:
      - /opt/bims/backups:/backups
    restart: unless-stopped

  # This is normally the main entry point for a production server
  rabbitmq:
    container_name: bims_prod_rabbitmq
    image: rabbitmq:3.7-alpine
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    restart: on-failure

  cache:
   container_name: bims_prod_memcached
   image: memcached
   entrypoint:
    - memcached
    - -m 64

  gbif_ipt:
    container_name: bims_prod_gbif_ipt
    image: kartoza/gbif_ipt:latest
    depends_on:
      - db
    volumes:
      - /opt/bims/ipt:/usr/local/ip
    restart: unless-stopped

  # ------------------------------------------------------------------
  # GeoNode 5.1.1 -> https://geonode.rbis.ur.ac.rw
  #
  # A separate application with its own GeoServer, PostGIS and Redis. It
  # lives on the private "geonode" network, where its containers use
  # GeoNode's stock host names (django, geoserver, db, redis). Those names
  # can't collide with BIMS's db / geoserver, which are on the default
  # network; BIMS and its GeoServer are not touched.
  #
  # Settings: geonode/common.env + geonode/prod.env + geonode/secrets.env
  # (secrets.env is created by geonode/make-secrets.sh; deploy.sh runs it).
  # Only the GeoNode nginx is published, on 127.0.0.1:5443, for the host
  # nginx (nginx/host/geonode.conf), which does TLS.
  #
  # Long-running like db and geoserver: deploy.sh leaves it alone. Start or
  # update it with
  #   docker-compose -f deployment/docker-compose.yml up -d geonode_nginx geonode_celery
  # (geonode_nginx pulls in django, geoserver, db, redis via depends_on)
  # ------------------------------------------------------------------
  geonode_django:
    <<: *default-geonode-django
    container_name: bims_prod_geonode_django
    environment:
      - IS_CELERY=False
    # Upstream's uwsgi.ini starts 16 workers and allows 128; flags after
    # --ini override it. This host also runs BIMS.
    command: uwsgi --ini /usr/src/geonode/uwsgi.ini --processes 8 --cheaper 2 --cheaper-initial 4 --cheaper-step 2
    healthcheck:
      test: curl -m 10 --fail --silent --output /dev/null http://django:8000/
      start_period: 180s
      interval: 60s
      timeout: 10s
      retries: 2
    networks:
      geonode:
        aliases:
          - django

  geonode_celery:
    <<: *default-geonode-django
    container_name: bims_prod_geonode_celery
    environment:
      - IS_CELERY=True
    command: celery-cmd
    networks:
      - geonode

  geonode_geoserver:
    container_name: bims_prod_geonode_geoserver
    image: geonode/geoserver:2.28.6-latest
    restart: unless-stopped
    env_file: *geonode-env
    volumes:
      - geonode-statics:/mnt/volumes/statics
      - geonode-geoserver-datadir:/geoserver_data/data
      - geonode-backup-restore:/backup_restore
      - geonode-data:/data
      - geonode-tmp:/tmp
    depends_on:
      - geonode_gsconf
      - geonode_django
    healthcheck:
      test: curl -m 10 --fail --silent --output /dev/null http://geoserver:8080/geoserver/ows
      start_period: 180s
      interval: 60s
      timeout: 10s
      retries: 2
    networks:
      geonode:
        aliases:
          - geoserver

  # Seeds the GeoServer data dir volume with GeoNode's preconfigured one
  # (OAuth2 login against GeoNode etc.). Stays up so the volume always has
  # a running container, which keeps "docker volume prune" off it.
  geonode_gsconf:
    container_name: bims_prod_geonode_gsconf
    image: geonode/geoserver_data:2.28.6-latest
    entrypoint: sleep infinity
    restart: unless-stopped
    volumes:
      - geonode-geoserver-datadir:/geoserver_data/data
    networks:
      - geonode

  geonode_db:
    container_name: bims_prod_geonode_db
    image: geonode/postgis:15-3.5-latest
    command: postgres -c max_connections=200
    restart: unless-stopped
    env_file: *geonode-env
    volumes:
      - geonode-dbdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -d postgres -U postgres
    networks:
      geonode:
        aliases:
          - db

  geonode_redis:
    container_name: bims_prod_geonode_redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - geonode-redisdata:/data
    networks:
      geonode:
        aliases:
          - redis

  # Shared by django and celery: GeoNode 5.1.1 keeps login sessions
  # (SESSION_ENGINE cached_db) and its background-task locks here, even
  # with MEMCACHED_ENABLED=False, so it isn't optional.
  geonode_memcached:
    container_name: bims_prod_geonode_memcached
    image: memcached:alpine
    restart: unless-stopped
    networks:
      geonode:
        aliases:
          - memcached

  geonode_nginx:
    container_name: bims_prod_geonode_nginx
    image: geonode/nginx:1.31.7-latest
    restart: unless-stopped
    env_file: *geonode-env
    ports:
      # Loopback only; the public side is the host nginx
      - "127.0.0.1:5443:443"
    volumes:
      - geonode-statics:/mnt/volumes/statics
    depends_on:
      - geonode_django
      - geonode_geoserver
    networks:
      geonode:
        aliases:
          - geonode
