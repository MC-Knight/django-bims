<div id="basicdashboard" class="rbis-occurrence-records">
    <h1>Biodiversity of Rwanda</h1>
    <div class="row summary-data"></div>
    <a href="/map"><i class="fa fa-map-o"></i> &nbsp;Explore Map »</a>
</div>

<!-- Popup Modal -->
<div id="taxonomyModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="taxonomyModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="taxonomyModalLabel">Taxonomic Details</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <!-- Search Bar -->
                <div class="mb-3">
                    <input type="text" id="taxonomySearch" class="form-control" placeholder="Search...">
                </div>

                <div id="modalContent">
                    <div class="text-center">
                        <i class="fa fa-spinner fa-spin fa-2x"></i>
                        <p>Loading...</p>
                    </div>
                </div>

                <!-- Pagination Controls -->
                <div id="paginationControls" class="mt-3" style="display: none;">
                    <nav aria-label="Taxonomy pagination">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" id="prevPage">
                                <a class="page-link" href="#" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>
                            <li class="page-item active">
                                <span class="page-link" id="currentPageInfo">Page 1</span>
                            </li>
                            <li class="page-item" id="nextPage">
                                <a class="page-link" href="#" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                    <div class="text-center">
                        <small id="paginationInfo" class="text-muted"></small>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Image Modal -->
<div id="imageModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="imageModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document" style="max-width: 500px; width: 500px;">
        <div class="modal-content" style="height: 500px;">
            <div class="modal-header">
                <h5 class="modal-title" id="imageModalLabel">Species Image</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body d-flex align-items-center justify-content-center" style="background-color: #000; padding: 0; height: calc(500px - 56px);">
                <img id="speciesImage" src="" alt="Species Image" style="max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain;">
            </div>
        </div>
    </div>
</div>

<!-- Sound Modal -->
<div id="soundModal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="soundModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document" style="max-width: 500px; width: 500px;">
        <div class="modal-content" style="height: 500px;">
            <div class="modal-header">
                <h5 class="modal-title" id="soundModalLabel">Species Sound</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body d-flex align-items-center justify-content-center" style="height: calc(500px - 56px);">
                <audio id="speciesAudio" controls style="width: 80%; max-width: 400px;">
                    <source id="audioSource" src="" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>
    </div>
</div>

<style>
.clickable-count {
    cursor: pointer;
    color: #00697d;
    text-decoration: none;
    transition: color 0.2s;
}

.clickable-count:hover {
    color: #0056b3;
    text-decoration: none;
}

.taxonomy-item {
    padding: 8px 12px;
    border-bottom: 1px solid #eee;
    transition: background-color 0.2s;
}

.taxonomy-item:hover {
    background-color: #f8f9fa;
}

.taxonomy-item:last-child {
    border-bottom: none;
}

.taxonomy-name {
    font-weight: bold;
    color: #333;
}

.taxonomy-scientific {
    font-style: italic;
    color: #666;
    font-size: 0.9em;
}

.taxonomy-meta {
    font-size: 0.8em;
    color: #888;
    margin-top: 2px;
}

.conservation-status {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 0.7em;
    font-weight: bold;
    text-transform: uppercase;
}

.status-lc { background-color: #28a745; color: white; }
.status-nt { background-color: #ffc107; color: black; }
.status-vu { background-color: #fd7e14; color: white; }
.status-en { background-color: #dc3545; color: white; }
.status-cr { background-color: #6f42c1; color: white; }
.status-ne { background-color: #6c757d; color: white; }
.status-dd { background-color: #17a2b8; color: white; }

.origin-native { color: #28a745; font-weight: bold; }
.origin-alien { color: #dc3545; font-weight: bold; }
.origin-translocated { color: #fd7e14; font-weight: bold; }



.modal-body {
    max-height: 500px;
    overflow-y: auto;
}

.taxonomy-summary {
    background-color: #f8f9fa;
    padding: 15px;
    border-radius: 5px;
    margin-bottom: 20px;
}

.pagination .page-link {
    cursor: pointer;
}

.pagination .page-item.disabled .page-link {
    cursor: not-allowed;
}

.species-media-links {
    display: inline-flex;
    gap: 8px;
    margin-left: 10px;
    float: right;
}

.media-link {
    display: inline-block;
    padding: 2px 8px;
    font-size: 0.75em;
    color: #007bff;
    text-decoration: none;
    border: 1px solid #007bff;
    border-radius: 3px;
    transition: all 0.2s;
    cursor: pointer;
}

.media-link:hover {
    background-color: #007bff;
    color: white;
    text-decoration: none;
}

.media-link i {
    margin-right: 3px;
}
</style>

<script>
    // Global variables for pagination state
    let currentModalState = {
        taxonGroupId: null,
        type: null,
        typeName: null,
        moduleName: null,
        currentPage: 1,
        pageSize: 50,
        searchQuery: '',
        searchTimeout: null,
        iucnStatus: ''
    };

    function getNumberWithCommas(number) {
        try {
            return number.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        } catch (e) {
            return ''
        }
    }

    function createDonutGraph(container, data, moduleId, moduleName) {
        let donutChart = new Chart(container, {
            type: 'doughnut',
            data: data,
            options: {
                cutoutPercentage: 70,
                legend: {
                    display: false
                },
                onClick: function(evt, item) {
                    if (item.length > 0) {
                        const index = item[0]._index;
                        const label = data.labels[index];
                        // Map label to IUCN status code
                        const statusMap = {
                            'Data deficient': 'DD',
                            'Not evaluated': 'NE',
                            'Least concern': 'LC',
                            'Near threatened': 'NT',
                            'Vulnerable': 'VU',
                            'Endangered': 'EN',
                            'Critically endangered': 'CR'
                        };
                        const statusCode = statusMap[label] || label;
                        showTaxonomyPopup(moduleId, 'species', 'Species', moduleName, statusCode);
                    }
                },
                tooltips: {
                    callbacks: {
                        afterLabel: function() {
                            return 'Click to view species';
                        }
                    }
                }
            }
        });
    }

    function getConservationStatusClass(status) {
        const statusMap = {
            'LC': 'status-lc',
            'NT': 'status-nt',
            'VU': 'status-vu',
            'EN': 'status-en',
            'CR': 'status-cr',
            'NE': 'status-ne',
            'DD': 'status-dd'
        };
        return statusMap[status] || 'status-ne';
    }

    function getOriginClass(origin) {
        if (origin && origin.toLowerCase().includes('native')) return 'origin-native';
        if (origin && origin.toLowerCase().includes('alien')) return 'origin-alien';
        if (origin && origin.toLowerCase().includes('translocated')) return 'origin-translocated';
        return '';
    }

    function showTaxonomyPopup(taxonGroupId, type, typeName, moduleName, iucnStatus = '') {
        // Store modal state
        currentModalState = {
            taxonGroupId: taxonGroupId,
            type: type,
            typeName: typeName,
            moduleName: moduleName,
            currentPage: 1,
            pageSize: 50,
            searchQuery: '',
            iucnStatus: iucnStatus
        };

        // Set modal title
        let modalTitle = `${typeName} - ${moduleName}`;
        if (iucnStatus) {
            modalTitle += ` (${iucnStatus})`;
        }
        $('#taxonomyModalLabel').text(modalTitle);

        // Clear and reset search
        $('#taxonomySearch').val('');

        // Show loading state
        $('#modalContent').html(`
            <div class="text-center">
                <i class="fa fa-spinner fa-spin fa-2x"></i>
                <p>Loading ${type}...</p>
            </div>
        `);

        // Hide pagination initially
        $('#paginationControls').hide();

        // Show modal
        $('#taxonomyModal').modal('show');

        // Load first page
        loadTaxonomyData();
    }

    function loadTaxonomyData() {
        const typeMap = {
            'species': '/api/taxon-group-species/',
            'families': '/api/taxon-group-families/',
            'orders': '/api/taxon-group-orders/'
        };

        const endpoint = typeMap[currentModalState.type] + currentModalState.taxonGroupId + '/';

        // Build query parameters
        const params = {
            page: currentModalState.currentPage,
            page_size: currentModalState.pageSize
        };

        if (currentModalState.searchQuery) {
            params.search = currentModalState.searchQuery;
        }

        if (currentModalState.iucnStatus) {
            params.iucn_status = currentModalState.iucnStatus;
        }

        // Fetch data
        $.get(endpoint, params)
            .then(function(data) {
                renderTaxonomyData(data);
                updatePaginationControls(data);
            })
            .catch(function(error) {
                console.error('Error loading taxonomy data:', error);
                $('#modalContent').html(`
                    <div class="alert alert-danger">
                        <h5>Error Loading Data</h5>
                        <p>Failed to load ${currentModalState.type} data. Please try again later.</p>
                    </div>
                `);
                $('#paginationControls').hide();
            });
    }

    function renderTaxonomyData(data) {
        if (!data || !data.data || data.data.length === 0) {
            $('#modalContent').html(`
                <div class="alert alert-info">
                    <h5>No Data Available</h5>
                    <p>No ${currentModalState.type} found${currentModalState.searchQuery ? ' matching your search' : ''}.</p>
                </div>
            `);
            $('#paginationControls').hide();
            return;
        }

        let content = `
            <div class="taxonomy-summary">
                <h6>${data.taxon_group_name}</h6>
                <p><strong>Total ${currentModalState.typeName}:</strong> ${getNumberWithCommas(data.total)}</p>
            </div>
            <div class="taxonomy-list">
        `;

        data.data.forEach(item => {
            content += '<div class="taxonomy-item">';

            // Species name and media links container
            content += '<div>';
            content += `<div class="taxonomy-name" style="display: inline-block;">${item.name}</div>`;

            // Add media links only for species
            if (currentModalState.type === 'species') {
                content += '<div class="species-media-links">';

                if (item.image_url) {
                    content += `<a href="javascript:void(0)" class="media-link" onclick="showImageModal('${item.image_url.replace(/'/g, "\\'")}', '${item.name.replace(/'/g, "\\'")}')">
                        <i class="fa fa-picture-o"></i>Image
                    </a>`;
                }

                if (item.sound_url) {
                    content += `<a href="javascript:void(0)" class="media-link" onclick="showSoundModal('${item.sound_url.replace(/'/g, "\\'")}', '${item.name.replace(/'/g, "\\'")}')">
                        <i class="fa fa-volume-up"></i>Sound
                    </a>`;
                }

                if (item.more_info_url) {
                    content += `<a href="${item.more_info_url}" target="_blank" class="media-link">
                        <i class="fa fa-info-circle"></i>More Info
                    </a>`;
                }

                content += '</div>';
            }
            content += '</div>';

            if (item.scientific_name && item.scientific_name !== item.name) {
                content += `<div class="taxonomy-scientific">${item.scientific_name}</div>`;
            }

            let metaInfo = [];

            if (item.family_name) {
                metaInfo.push(`Family: ${item.family_name}`);
            }

            if (item.order_name) {
                metaInfo.push(`Order: ${item.order_name}`);
            }

            if (item.conservation_status) {
                const statusClass = getConservationStatusClass(item.conservation_status);
                metaInfo.push(`<span class="conservation-status ${statusClass}">${item.conservation_status}</span>`);
            }

            if (item.origin) {
                const originClass = getOriginClass(item.origin);
                metaInfo.push(`<span class="${originClass}">${item.origin}</span>`);
            }

            if (metaInfo.length > 0) {
                content += `<div class="taxonomy-meta">${metaInfo.join(' • ')}</div>`;
            }

            content += '</div>';
        });

        content += '</div>';

        $('#modalContent').html(content);
    }

    function updatePaginationControls(data) {
        if (data.total === 0) {
            $('#paginationControls').hide();
            return;
        }

        $('#paginationControls').show();

        // Update current page info
        const start = (data.page - 1) * data.page_size + 1;
        const end = Math.min(data.page * data.page_size, data.total);
        $('#currentPageInfo').text(`Page ${data.page}`);
        $('#paginationInfo').text(`Showing ${start}-${end} of ${getNumberWithCommas(data.total)} ${currentModalState.typeName.toLowerCase()}`);

        // Update previous button
        if (data.has_previous) {
            $('#prevPage').removeClass('disabled');
            $('#prevPage a').off('click').on('click', function(e) {
                e.preventDefault();
                currentModalState.currentPage--;
                loadTaxonomyData();
            });
        } else {
            $('#prevPage').addClass('disabled');
            $('#prevPage a').off('click');
        }

        // Update next button
        if (data.has_next) {
            $('#nextPage').removeClass('disabled');
            $('#nextPage a').off('click').on('click', function(e) {
                e.preventDefault();
                currentModalState.currentPage++;
                loadTaxonomyData();
            });
        } else {
            $('#nextPage').addClass('disabled');
            $('#nextPage a').off('click');
        }
    }

    // Search functionality with debounce
    $('#taxonomySearch').on('input', function() {
        const searchValue = $(this).val();

        // Clear existing timeout
        if (currentModalState.searchTimeout) {
            clearTimeout(currentModalState.searchTimeout);
        }

        // Set new timeout
        currentModalState.searchTimeout = setTimeout(function() {
            currentModalState.searchQuery = searchValue;
            currentModalState.currentPage = 1; // Reset to first page on search
            loadTaxonomyData();
        }, 500); // Wait 500ms after user stops typing
    });

    // Function to show image modal
    function showImageModal(imageUrl, speciesName) {
        $('#imageModalLabel').text(speciesName + ' - Image');
        $('#speciesImage').attr('src', imageUrl);
        $('#imageModal').modal('show');
    }

    // Function to show sound modal
    function showSoundModal(soundUrl, speciesName) {
        $('#soundModalLabel').text(speciesName + ' - Sound');
        $('#audioSource').attr('src', soundUrl);
        $('#speciesAudio')[0].load(); // Reload audio element
        $('#soundModal').modal('show');
    }

    // Stop audio when sound modal is closed
    $('#soundModal').on('hidden.bs.modal', function () {
        $('#speciesAudio')[0].pause();
        $('#speciesAudio')[0].currentTime = 0;
    });

    function createModuleCharts(moduleData, moduleName, container) {
        if (!moduleData) {
            return;
        }
        const img = new Image();
        let chartWrapper = $('<div class="chart-icon-wrapper" />');
        img.classList = 'module-icon';
        img.style = 'width: 40px; height: 40px; margin-right: auto; margin-left: auto; display: block;';
        img.src = moduleData['icon'];
        chartWrapper.append(img);
        let canvas = $(`<div class="donut-chart"><canvas id="chart-${moduleName}" width="150px" height="150px"></canvas></div>`);
        chartWrapper.append(canvas);
        container.append(chartWrapper);

        let native = 0;
        let non_native = 0;
        let translocated = 0;
        let totalRecords = 0;
        let totalSass = 0;
        let totalSite = 0;
        let totalSiteVisit = 0;
        let alienInvasive = 0;
        let alienNonInvasive = 0;
        let unspecified = 0;
        let moduleId = moduleData['taxon_group_id'] ? moduleData['taxon_group_id'] : null;

        let ce = 'Critically endangered'
        let dd = 'Data deficient'
        let en = 'Endangered'
        let lc = 'Least concern'
        let nt = 'Near threatened'
        let ne = 'Not evaluated'
        let vu = 'Vulnerable'
        let cons_labels = [
            dd, ne, lc, nt, vu, en ,ce
        ]
        let ce_data = 0
        let dd_data = 0
        let en_data = 0
        let lc_data = 0
        let nt_data = 0
        let ne_data = 0
        let vu_data = 0

        if (moduleData.hasOwnProperty(ce)) {
            ce_data += moduleData[ce];
        }
        if (moduleData.hasOwnProperty(dd)) {
            dd_data += moduleData[dd];
        }
        if (moduleData.hasOwnProperty(en)) {
            en_data += moduleData[en];
        }
        if (moduleData.hasOwnProperty(lc)) {
            lc_data += moduleData[lc];
        }
        if (moduleData.hasOwnProperty(nt)) {
            nt_data += moduleData[nt];
        }
        if (moduleData.hasOwnProperty(ne)) {
            ne_data += moduleData[ne];
        }
        if (moduleData.hasOwnProperty(vu)) {
            vu_data += moduleData[vu];
        }

        if (moduleData.hasOwnProperty('total')) {
            totalRecords += moduleData['total'];
        }
        if (moduleData.hasOwnProperty('alien')) {
            non_native += moduleData['alien'];
        }
        if (moduleData.hasOwnProperty('indigenous')) {
            native += moduleData['indigenous'];
        }
        if (moduleData.hasOwnProperty('translocated')) {
            translocated += moduleData['translocated'];
        }
        if (moduleData.hasOwnProperty('alien-invasive')) {
            alienInvasive += moduleData['alien-invasive'];
        }
        if (moduleData.hasOwnProperty('alien-non-invasive')) {
            alienNonInvasive += moduleData['alien-non-invasive'];
        }
        if (moduleData.hasOwnProperty('Unspecified')) {
            unspecified += moduleData['Unspecified'];
        }
        if (moduleData.hasOwnProperty('total_site')) {
            totalSite += moduleData['total_site'];
        }
        if (moduleData.hasOwnProperty('total_site_visit')) {
            totalSiteVisit += moduleData['total_site_visit'];
        }
        if (moduleData.hasOwnProperty('total_sass')) {
            totalSass += moduleData['total_sass'];
        }
        container.append(
            `<h4 class="module-name">${moduleName}</h4>`
        )

        let $moduleInfoContainer = $(`<div class="module-info-container"/>`);

        $moduleInfoContainer.append(
            `<a
                style="margin-bottom: 0; font-size: 1em; cursor: pointer;
                color: #00697d;
                text-decoration: none;
                transition: color 0.2s;
                background: none;
                border: none;"
                href="/map/#search//taxon=&search=&siteId=&collector=&category=&yearFrom=&yearTo=&months=&boundary=&userBoundary=&referenceCategory=&spatialFilter=&reference=&endemic=&conservationStatus=[]&modules=${moduleId}&validated=&sourceCollection=&abioticData=&ecologicalCategory=&rank=&siteIdOpen=&orderBy=name&polygon=&thermalModule=&dst="><span class="module-numbers">${getNumberWithCommas(totalRecords)}</span> Occurrence Records</a>`
        )

        if(moduleData.taxon_group_id){
            loadTotalCounts(moduleData.taxon_group_id, $moduleInfoContainer, moduleName);
        }

        container.append($moduleInfoContainer);

        let moduleContainer = document.getElementById("chart-" + moduleName);
        let moduleChartDataset = {
            labels: cons_labels,
            datasets: [{
                data: [dd_data, ne_data, lc_data, nt_data, vu_data, en_data, ce_data],
                backgroundColor: [
                    '#D7CD47',
                    '#39B2A3',
                    '#17766B',
                    '#2C495A',
                    '#525351',
                    '#8D2641',
                    '#641f30',
                ],
                borderWidth: 1
            }]
        };
        createDonutGraph(moduleContainer, createSummaryChart(moduleData), moduleId, moduleName)
    }

    if (showModuleSummaries) {
        $.get('/api/module-summary').then(
            function (data) {
                $('.module-loading').hide();
                const $container = $('.summary-data');
                 if(data && Object.keys(data).length > 0){
                    $.each(data, function(key, summaryData) {
                        let _container = $(`<div class="col-lg-2 col-md-8 col-sm-8 module-container"></div>`);
                        $container.append(_container);
                        createModuleCharts(
                            summaryData,
                            key,
                            _container
                        )
                    });
                 } else {
                    $container.append('<p>No module summary data available at the moment.</p>');
                 }
            }
        )
    }

    function loadTotalCounts(taxonGroupId, container, moduleName) {
        const orderedItems = [
            { label: 'Orders', type: 'orders', id: `orders-${taxonGroupId}` },
            { label: 'Families', type: 'families', id: `families-${taxonGroupId}` },
            { label: 'Species', type: 'species', id: `species-${taxonGroupId}` }
        ];

        if (!$('#loading-pulse-css').length) {
            $('head').append(`
                <style id="loading-pulse-css">
                    .loading-pulse {
                        display: inline-block;
                        background: linear-gradient(-90deg, #f0f0f0 0%, #e0e0e0 50%, #f0f0f0 100%);
                        background-size: 400% 400%;
                        animation: pulse 1.5s ease-in-out infinite;
                        border-radius: 3px;
                        height: 1em;
                        width: 60px;
                        vertical-align: middle;
                    }

                    @keyframes pulse {
                        0% { background-position: 0% 0%; }
                        100% { background-position: -200% 0%; }
                    }
                </style>
            `);
        }

        orderedItems.forEach(item => {
            const placeholderElement = $(`
                <p class="module-info" style="margin-bottom: 0; font-size: 1em" id="${item.id}">
                    <span class="loading-pulse"></span> ${item.label}
                </p>
            `);
            container.append(placeholderElement);
        });


        const requests = [
            { endpoint: `/api/taxon-group-species/${taxonGroupId}/`, label: 'Species', type: 'species' },
            { endpoint: `/api/taxon-group-families/${taxonGroupId}/`, label: 'Families', type: 'families' },
            { endpoint: `/api/taxon-group-orders/${taxonGroupId}/`, label: 'Orders', type: 'orders' }
        ];


        requests.forEach(request => {
            $.get(request.endpoint)
                .then(function(data) {
                    const targetId = `${request.type}-${taxonGroupId}`;
                    const total = data && data.total ? data.total : 0;


                    const clickableCount = `<span class="module-numbers clickable-count"
                        onclick="showTaxonomyPopup('${taxonGroupId}', '${request.type}', '${request.label}', '${moduleName}')"
                        title="Click to view details">
                        ${getNumberWithCommas(total)} ${request.label}
                    </span>`;

                    $(`#${targetId}`).html(clickableCount);
                })
                .catch(function(error) {
                    console.error(`Error loading total ${request.type}:`, error);
                    const targetId = `${request.type}-${taxonGroupId}`;
                    const clickableCount = `<span class="module-numbers clickable-count"
                        onclick="showTaxonomyPopup('${taxonGroupId}', '${request.type}', '${request.label}', '${moduleName}')"
                        title="Click to view details">
                        0 ${request.label}
                    </span>`;
                    $(`#${targetId}`).html(clickableCount);
                });
        });
    }
</script>
